# Naya Create right half (nRF52840, Adafruit UF2 bootloader, app at 0x26000)
# built as a standalone keyboard on the nice!nano v2 board definition,
# with ZMK Studio enabled so keys can be remapped from https://zmk.studio
include:
  - board: nice_nano_v2
    shield: naya_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
