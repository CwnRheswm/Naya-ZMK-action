# Keys only for the first build. Leave the Naya board's other hardware alone.
# nice!nano's external-power switch is P0.13 - unknown on the Naya board, so don't drive it.
CONFIG_ZMK_EXT_POWER=n
# Battery divider wiring differs from the nice!nano; reporting would be wrong.
CONFIG_ZMK_BATTERY_REPORTING=n
# No deep sleep while we're testing.
CONFIG_ZMK_SLEEP=n
