# LED power switch (P1.04 on this board) - used by the underglow.
CONFIG_ZMK_EXT_POWER=y
# Battery level via the AIN3 divider; Windows shows it when paired over Bluetooth.
CONFIG_ZMK_BATTERY_REPORTING=y
# RGB lighting on the 44 WS2812 LEDs.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# LED idle timeout is handled in naya_ctrl.c (settable from the app, saved on the keyboard).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
# No deep sleep yet.
CONFIG_ZMK_SLEEP=n
# Command port for the Naya Control app (src/naya_ctrl.c).
CONFIG_NAYA_CTRL=y
# Mouse input from the touch module (changes the HID descriptor: re-pair Bluetooth hosts once).
CONFIG_ZMK_POINTING=y
# Lock-light state from the computer; Scroll Lock on = Arrows layer (src/arrow_lock.c).
CONFIG_ZMK_HID_INDICATORS=y
